# 叼物选择页（嘴部）
title: "<gradient:#F6D365:#FDA085><bold>叼物 · {name}</bold></gradient>"
size: 27

filler:
  material: ORANGE_STAINED_GLASS_PANE
  name: " "

items:
  none:
    slot: 10
    material: BARRIER
    name: "<red><bold>移除叼物</bold></red>"
    lore:
      - "<gray>清空嘴里的物品</gray>"
      - "<dark_gray>狐狸用主手；其他生物用嘴部展示</dark_gray>"
    action: mouth_none

  bone:
    slot: 11
    material: BONE
    name: "<white><bold>骨头</bold></white>"
    action: mouth_bone

  stick:
    slot: 12
    material: STICK
    name: "<gold><bold>木棍</bold></gold>"
    action: mouth_stick

  rose:
    slot: 13
    material: POPPY
    name: "<red><bold>花朵</bold></red>"
    action: mouth_rose

  porkchop:
    slot: 14
    material: PORKCHOP
    name: "<light_purple><bold>生猪排</bold></light_purple>"
    action: mouth_porkchop

  apple:
    slot: 15
    material: APPLE
    name: "<red><bold>苹果</bold></red>"
    action: mouth_apple

  cookie:
    slot: 16
    material: COOKIE
    name: "<gold><bold>曲奇</bold></gold>"
    action: mouth_cookie

  back:
    slot: 22
    material: ARROW
    name: "<yellow>返回</yellow>"
    action: back
