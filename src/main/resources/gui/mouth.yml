# 叼物选择页
title: "<gradient:#F6D365:#FDA085><bold>叼物 · {name}</bold></gradient>"
size: 27

filler:
  material: ORANGE_STAINED_GLASS_PANE
  name: " "

items:
  none:
    slot: 10
    material: BARRIER
    name: "<red><bold>移除叼物</bold></red>"
    lore:
      - "<gray>清空嘴上的物品</gray>"
    action: mouth_none

  bone:
    slot: 11
    material: BONE
    name: "<white><bold>骨头</bold></white>"
    action: mouth_bone

  stick:
    slot: 12
    material: STICK
    name: "<gold><bold>木棍</bold></gold>"
    action: mouth_stick

  rose:
    slot: 13
    material: POPPY
    name: "<red><bold>花朵</bold></red>"
    action: mouth_rose

  porkchop:
    slot: 14
    material: PORKCHOP
    name: "<light_purple><bold>生猪排</bold></light_purple>"
    action: mouth_porkchop

  diamond:
    slot: 15
    material: DIAMOND
    name: "<aqua><bold>钻石</bold></aqua>"
    action: mouth_diamond

  sword:
    slot: 16
    material: GOLDEN_SWORD
    name: "<yellow><bold>金剑</bold></yellow>"
    action: mouth_sword

  back:
    slot: 22
    material: ARROW
    name: "<yellow>返回</yellow>"
    action: back
