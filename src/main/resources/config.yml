# McPets 主配置 —— 几乎所有数值都可在此调整

settings:
  # 驯服准星最大距离
  tame-range: 8
  # 交互（Shift+右键）最大距离
  interact-range: 5
  # 跟随开始走路的距离 / 传送拉回距离
  follow-start-distance: 4.0
  follow-teleport-distance: 16.0
  follow-speed: 1.2
  # 漫步半径与间隔（tick）
  wander-radius: 6.0
  wander-interval-ticks: 60
  # 实体丢失时是否提示主人（默认关闭=静默删档）
  notify-missing-pet: false
  # 自动保存间隔（秒），0 = 仅在变更/关闭时保存
  auto-save-seconds: 120
  # 每个玩家最多可拥有的宠物数量
  max-pets-per-player: 5
  # 跟随 AI 执行间隔（tick）；攻击仍用 attack.interval-ticks
  follow-interval-ticks: 8
  # 实体疑似丢失时的确认次数 / 间隔（避免未加载区块误删）
  missing-check-attempts: 3
  missing-check-interval-ticks: 100
  # 显示名可见字数上限（不含颜色/格式符号）；内部名仍为 1-16
  max-display-name-length: 24
  # 插件被 disable / 热重载时对已存在宠物的处理：
  # park    = 实体留在世界，关闭无敌/攻击/叼物/AI，保留原版名字，重载后按 pets.yml 实体UUID恢复
  # despawn = 移除实体并写档，插件再次启用时按存档坐标重新生成（装备等 NBT 不保留）
  unload-mode: park

blacklist:
  # 不可驯服的实体类型（Bukkit EntityType 名）
  - ENDER_DRAGON
  - WITHER
  - WARDEN
  - ARMOR_STAND
  - PLAYER

attack:
  enabled-by-default: false
  # 每次伤害（HP；1.0 = 半颗心）
  damage: 1.0
  # 每个目标最多攻击次数（独立计数）
  max-hits-per-target: 6
  # 仇恨持续时间（秒）；超时结束本次点击攻击
  hate-duration-seconds: 60
  # 点击攻击：锁定并追击的最大半径（格）；只打点击时选中的那一名
  auto-range: 5.0
  # 攻击间隔（tick）
  interval-ticks: 20
  # 攻击寻路速度
  speed: 1.35

scale:
  # 三档缩放（Attribute SCALE）；也可在 GUI 使用原版 baby
  tiers:
    - 0.5
    - 1.0
    - 2.0
  default-tier: 1

mouth-item:
  # 真正叼物：乘客挂点多在头顶，向前 + 向下贴近嘴（offset-up 建议为负）
  offset-forward: 0.45
  offset-up: -0.55
  display-scale: 0.35
  eye-factor: 1.0

float-item:
  # 悬浮物：头顶上方装饰，可轻微浮动
  offset-up: 1.15
  offset-forward: 0.0
  display-scale: 0.5
  bob: true
  bob-amplitude: 0.08

particles:
  # 自研预设粒子间隔（tick）
  interval-ticks: 10
  presets:
    none:
      enabled: false
    heart:
      particle: HEART
      count: 2
      offset: 0.3
    flame:
      particle: FLAME
      count: 3
      offset: 0.25
    enchant:
      particle: ENCHANT
      count: 8
      offset: 0.5
    note:
      particle: NOTE
      count: 2
      offset: 0.35
    happy:
      particle: HAPPY_VILLAGER
      count: 4
      offset: 0.4

